name: Smoke Tests
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.x" }
      - run: pip install -e .[dev]
      - run: pytest -m smoke --no-cov -v