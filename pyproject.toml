[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nowcastingcli"
version = "0.6.0"
description = "Terminal weather nowcasting dashboard"
requires-python = ">=3.11"
dependencies = ["rich>=13.0", "python-json-logger"]

[project.scripts]
nowcastingcli = "nowcastingcli.main:cli"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=nowcastingcli --cov-fail-under=80"
markers = [
    #"integration: mark a test as an integration test.",
    #"unit: mark a test as a unit test.",
    "smoke: fast subset run on every push/PR to develop",
]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.5,<2.0",
    "mkdocs-material",
    "mkdocstrings[python]",
]
dev = [
    "pytest",
    "pytest-cov",
    "setuptools",
    "wheel",
]